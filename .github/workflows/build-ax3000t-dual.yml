name: Build Xiaomi AX3000T V1 and V2 firmware (UA3F TPROXY + PassWall)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "configs/ax3000t-v1-v2.config"
      - "files/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/build-ax3000t-dual.yml"

permissions:
  contents: read

concurrency:
  group: ax3000t-ua3f-passwall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AX3000T ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: V1-MT7531
            target: xiaomi-mi-router-ax3000t
            config_symbol: CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t
          - variant: V2-AN8855
            target: xiaomi-mi-router-ax3000t-an8855
            config_symbol: CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t-an8855

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/local/lib/heroku \
            /usr/local/share/chromium \
            /usr/lib/jvm \
            /opt/az \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h
          df -ih

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-dev python3-setuptools \
            python3-pyelftools rsync unzip zlib1g-dev file wget curl swig \
            device-tree-compiler time libelf-dev

      - name: Clone OpenWrt 25.12 stable branch
        run: |
          git clone --depth 1 --branch openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt
          git -C openwrt rev-parse HEAD | tee openwrt-source-commit.txt

      - name: Install pinned PassWall and UA3F sources
        run: bash scripts/prepare.sh openwrt

      - name: Add AX3000T V2 AN8855 target
        if: matrix.variant == 'V2-AN8855'
        run: bash scripts/add-ax3000t-an8855-target.sh openwrt

      - name: Configure target and resolve packages
        env:
          CONFIG_SYMBOL: ${{ matrix.config_symbol }}
          VARIANT: ${{ matrix.variant }}
        run: |
          cp configs/ax3000t-v1-v2.config openwrt/.config
          printf '\n%s=y\n' "$CONFIG_SYMBOL" >> openwrt/.config
          if [ "$VARIANT" = "V2-AN8855" ]; then
            printf '# CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t is not set\n' >> openwrt/.config
          fi
          make -C openwrt defconfig
          grep -E '^CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t(-an8855)?=y$|^CONFIG_TARGET_ROOTFS_(INITRAMFS|SQUASHFS)=y$' openwrt/.config
          cp openwrt/.config build.config

      - name: Stage first-boot settings and diagnostics
        run: |
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
          chmod 0755 openwrt/files/etc/uci-defaults/99-ax3000t-ua3f-passwall
          chmod 0755 openwrt/files/usr/bin/ua3f-passwall-check
          test -x openwrt/files/etc/uci-defaults/99-ax3000t-ua3f-passwall
          test -x openwrt/files/usr/bin/ua3f-passwall-check

      - name: Validate UA3F TPROXY and PassWall profile
        run: bash scripts/validate-ua3f-passwall-profile.sh openwrt

      - name: Print proxy and theme profile
        run: |
          echo "===== UA3F dependencies ====="
          grep -E '^CONFIG_PACKAGE_(kmod-nft-queue|kmod-nft-tproxy|kmod-sched-bpf|libubox-lua|ua3f)=y$' openwrt/.config
          echo "===== PassWall ====="
          grep -E '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-passwall_Nftables_Transparent_Proxy|sing-box|xray-core)=y$' openwrt/.config
          echo "===== theme ====="
          grep -E '^CONFIG_PACKAGE_luci-theme-argon=y$' openwrt/.config
          echo "===== OpenWrt source ====="
          cat openwrt-source-commit.txt

      - name: Download source archives
        run: make -C openwrt download -j8

      - name: Compile firmware
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          # V1 previously failed with "Error: No binaries were built" from the
          # UA3F Go package while a parallel make invocation installed the same
          # package. Serialize V1 compilation to avoid concurrent Go package
          # target races; keep V2's already-successful parallel setting intact.
          if [ "$VARIANT" = "V1-MT7531" ]; then
            make -C openwrt -j1 V=s
          else
            make -C openwrt -j2 V=s
          fi

      - name: Verify images and create SHA256
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          cd openwrt/bin/targets/mediatek/filogic
          find . -maxdepth 1 -type f \( -iname '*xiaomi*ax3000t*' -o -iname '*sha256sums*' \) -printf '%f %s bytes\n' | sort
          sysupgrade="$(find . -maxdepth 1 -type f -iname '*xiaomi*ax3000t*squashfs-sysupgrade.bin' -print -quit)"
          factory="$(find . -maxdepth 1 -type f -iname '*initramfs-factory.ubi' -print -quit)"
          test -n "$sysupgrade" || { echo "Missing sysupgrade image for $VARIANT" >&2; exit 1; }
          test -n "$factory" || { echo "Missing initramfs recovery image for $VARIANT" >&2; exit 1; }
          find . -maxdepth 1 -type f \( -iname '*xiaomi*ax3000t*' -o -iname '*sha256sums*' \) -print0 \
            | xargs -0 -r sha256sum > "$GITHUB_WORKSPACE/sha256sums-$VARIANT.txt"
          test -s "$GITHUB_WORKSPACE/sha256sums-$VARIANT.txt"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-${{ matrix.variant }}-UA3F-TPROXY-PassWall-OpenWrt-25.12
          if-no-files-found: error
          retention-days: 14
          path: |
            openwrt/bin/targets/mediatek/filogic/*xiaomi*ax3000t*
            openwrt/.config
            build.config
            openwrt-source-commit.txt
            sha256sums-${{ matrix.variant }}.txt
